<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Tienda oficial FULLTECH SRL. Tecnologia, seguridad y automatizacion.">
  <meta name="theme-color" content="#0F172A">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FULLTECH">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="shortcut icon" type="image/png" href="favicon.png">

  <title>FULLTECH SRL</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: #0F172A;
    }

    #splash-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #0F172A 100%);
      z-index: 9999;
      transition: opacity 0.35s ease-out;
      overflow: hidden;
    }

    #splash-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .splash-pattern {
      position: absolute;
      inset: 0;
      opacity: 0.04;
      pointer-events: none;
    }

    .splash-pattern div {
      position: absolute;
      border-radius: 50%;
      background: #2563EB;
    }

    .splash-pattern .dot1 { width: 300px; height: 300px; top: -80px; right: -60px; }
    .splash-pattern .dot2 { width: 200px; height: 200px; bottom: -40px; left: -40px; }
    .splash-pattern .dot3 { width: 120px; height: 120px; top: 40%; left: 10%; }

    .splash-logo {
      width: 100px;
      height: 100px;
      border-radius: 24px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.2);
    }

    .splash-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .splash-title {
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .splash-subtitle {
      color: rgba(255, 255, 255, 0.64);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 28px;
    }

    .splash-loader {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #2563EB;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .splash-message {
      color: rgba(255, 255, 255, 0.45);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      margin-top: 18px;
      letter-spacing: 0.3px;
      text-align: center;
      max-width: 300px;
      line-height: 1.45;
      padding: 0 18px;
    }

    .splash-actions {
      display: none;
      margin-top: 16px;
    }

    .splash-actions.visible {
      display: flex;
    }

    .splash-button {
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      background: #2563EB;
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.28);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="splash-screen">
    <div class="splash-pattern">
      <div class="dot1"></div>
      <div class="dot2"></div>
      <div class="dot3"></div>
    </div>
    <div class="splash-logo">
      <img src="favicon.png" alt="FULLTECH SRL" onerror="this.style.display='none'">
    </div>
    <div class="splash-title">FULLTECH</div>
    <div class="splash-subtitle">Tienda oficial</div>
    <div class="splash-loader"></div>
    <div class="splash-message" id="splash-message">Tecnologia, seguridad y automatizacion.</div>
    <div class="splash-actions" id="splash-actions">
      <button type="button" class="splash-button" onclick="window.location.reload()">Recargar tienda</button>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      var BUILD_VERSION = '__FULLTECH_BUILD_VERSION__';
      var VERSION_KEY = 'fulltech_app_version';
      var splashHidden = false;

      function hideSplash() {
        if (splashHidden) return;
        splashHidden = true;
        var splash = document.getElementById('splash-screen');
        if (splash) {
          splash.classList.add('hidden');
        }
      }

      function showSlowLoadingState() {
        var splash = document.getElementById('splash-screen');
        if (!splash || splash.classList.contains('hidden')) return;

        var message = document.getElementById('splash-message');
        var actions = document.getElementById('splash-actions');
        if (message) {
          message.textContent = 'La tienda esta tardando mas de lo normal. Puedes recargar mientras terminamos de iniciar.';
        }
        if (actions) {
          actions.classList.add('visible');
        }
      }

      function detectFlutterAndHideSplash() {
        var splash = document.getElementById('splash-screen');
        if (!splash) return;

        function checkFlutterSurface() {
          return document.querySelector('flt-glass-pane') || document.querySelector('canvas');
        }

        if (checkFlutterSurface()) {
          hideSplash();
          return;
        }

        var observer = new MutationObserver(function () {
          if (checkFlutterSurface()) {
            observer.disconnect();
            hideSplash();
          }
        });

        observer.observe(document.body, {
          childList: true,
          subtree: true,
        });

        setTimeout(function () {
          if (checkFlutterSurface()) {
            observer.disconnect();
            hideSplash();
          }
        }, 500);
      }

      function clearRuntimeCaches() {
        var tasks = [];

        if ('serviceWorker' in navigator) {
          tasks.push(
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
              return Promise.all(
                registrations.map(function (registration) {
                  return registration.unregister();
                })
              );
            })
          );
        }

        if (window.caches) {
          tasks.push(
            caches.keys().then(function (cacheNames) {
              return Promise.all(
                cacheNames.map(function (cacheName) {
                  return caches.delete(cacheName);
                })
              );
            })
          );
        }

        return Promise.all(tasks).catch(function (error) {
          console.warn('[FULLTECH] Error limpiando caches:', error);
        });
      }

      function forceServiceWorkerCleanup() {
        if (!('serviceWorker' in navigator)) {
          return Promise.resolve(false);
        }

        return navigator.serviceWorker.getRegistrations()
          .then(function (registrations) {
            if (!registrations.length) {
              return false;
            }

            return clearRuntimeCaches().then(function () {
              return true;
            });
          })
          .catch(function (error) {
            console.warn('[FULLTECH] No se pudo verificar service workers activos.', error);
            return false;
          });
      }

      function fetchVersionWithTimeout(timeoutMs) {
        return new Promise(function (resolve, reject) {
          var settled = false;
          var timer = setTimeout(function () {
            if (settled) return;
            settled = true;
            reject(new Error('version.json timeout'));
          }, timeoutMs);

          fetch('version.json?ts=' + Date.now(), {
            cache: 'no-store',
          })
            .then(function (response) {
              if (!response.ok) {
                throw new Error('No se pudo cargar version.json');
              }
              return response.json();
            })
            .then(function (payload) {
              if (settled) return;
              settled = true;
              clearTimeout(timer);
              resolve(payload);
            })
            .catch(function (error) {
              if (settled) return;
              settled = true;
              clearTimeout(timer);
              reject(error);
            });
        });
      }

      function loadFlutter(version) {
        var script = document.createElement('script');
        script.src = 'flutter_bootstrap.js?v=' + encodeURIComponent(version || Date.now().toString());
        script.async = false;
        script.onload = function () {
          detectFlutterAndHideSplash();
        };
        document.body.appendChild(script);
      }

      window.fulltechHideSplash = hideSplash;
      window.fulltechReloadPage = function () {
        window.location.reload();
      };
      window.fulltechPwaDeferredPrompt = null;
      window.fulltechPwaPromptInstall = function () {
        var prompt = window.fulltechPwaDeferredPrompt;
        if (!prompt) {
          return Promise.resolve({ outcome: 'not_available' });
        }
        return prompt.prompt().then(function () {
          return prompt.userChoice.then(function (choiceResult) {
            window.fulltechPwaDeferredPrompt = null;
            return { outcome: choiceResult.outcome };
          });
        });
      };
      window.fulltechPwaIsAvailable = function () {
        return window.fulltechPwaDeferredPrompt !== null;
      };

      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        window.fulltechPwaDeferredPrompt = event;
      });

      var path = window.location.pathname || '/';
      var hash = window.location.hash || '';
      var isRootPath = path === '/' || path === '';
      var isEmptyHash = hash === '' || hash === '#' || hash === '#/';
      if (isRootPath && isEmptyHash) {
        window.location.hash = '#/tienda/fulltech';
      }

      forceServiceWorkerCleanup()
        .then(function () {
          return fetchVersionWithTimeout(2500);
        })
        .then(function (payload) {
          var currentVersion =
            BUILD_VERSION !== '__FULLTECH_BUILD_VERSION__'
              ? BUILD_VERSION
              : (payload && payload.version) || Date.now().toString();
          var lastVersion = localStorage.getItem(VERSION_KEY);

          if (lastVersion && lastVersion !== currentVersion) {
            return clearRuntimeCaches().then(function () {
              localStorage.setItem(VERSION_KEY, currentVersion);
              loadFlutter(currentVersion);
            });
          }

          localStorage.setItem(VERSION_KEY, currentVersion);
          loadFlutter(currentVersion);
        })
        .catch(function (error) {
          console.warn('[FULLTECH] version.json lento o no disponible, cargando bootstrap directo.', error);
          loadFlutter(
            BUILD_VERSION !== '__FULLTECH_BUILD_VERSION__'
              ? BUILD_VERSION
              : Date.now().toString()
          );
        });

      setTimeout(showSlowLoadingState, 8000);
    })();
  </script>
</body>
</html>
