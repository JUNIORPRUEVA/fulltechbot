server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ==========================================
    # GZIP COMPRESSION
    # ==========================================
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        text/js
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/manifest+json
        image/svg+xml
        image/x-icon
        font/woff
        font/woff2;

    # ==========================================
    # BROTLI COMPRESSION (si está disponible)
    # ==========================================
    brotli on;
    brotli_comp_level 6;
    brotli_types
        text/plain
        text/css
        text/javascript
        text/xml
        text/js
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/manifest+json
        image/svg+xml
        image/x-icon
        font/woff
        font/woff2;

    # ==========================================
    # MIME TYPES
    # ==========================================
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ==========================================
    # SPA ROUTING - Todas las rutas a index.html
    # ==========================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ==========================================
    # index.html: NUNCA cachear
    # ==========================================
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate, private, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # ==========================================
    # Archivos críticos de Flutter: NUNCA cachear
    # ==========================================
    location ~* /(flutter_bootstrap\.js|flutter\.js|main\.dart\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate, private, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # ==========================================
    # Service Workers: NUNCA cachear
    # ==========================================
    location ~* /(service_worker\.js|flutter_service_worker\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate, private, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    # ==========================================
    # Assets con hash: Cache público e inmutable
    # Los assets de Flutter Web tienen hash en el nombre
    # ==========================================
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ==========================================
    # clear-cache.html: NUNCA cachear
    # ==========================================
    location = /clear-cache.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate, private, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # ==========================================
    # Archivos estáticos con extensión conocida
    # Cache largo para imágenes, fuentes, etc.
    # ==========================================
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # ==========================================
    # Security headers
    # ==========================================
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
