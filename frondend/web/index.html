<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Tienda oficial FULLTECH SRL. Tecnología, seguridad y automatización.">
  <meta name="theme-color" content="#0F172A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FULLTECH">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FULLTECH SRL</title>
  <link rel="manifest" href="manifest.json">

  <!-- Meta tags anti-cache -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <style>
    /* ============================================
       SPLASH SCREEN - Se muestra inmediatamente
       mientras Flutter carga. Sin pantalla blanca.
       ============================================ */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      width: 100%;
      height: 100%;
      background: #0F172A;
    }

    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #0F172A 100%);
      z-index: 9999;
      transition: opacity 0.4s ease-out;
    }

    #splash-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .splash-logo {
      width: 80px;
      height: 80px;
      background: rgba(37, 99, 235, 0.15);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      border: 1px solid rgba(37, 99, 235, 0.2);
    }

    .splash-logo svg {
      width: 44px;
      height: 44px;
    }

    .splash-title {
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .splash-subtitle {
      color: rgba(255, 255, 255, 0.6);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 32px;
    }

    .splash-loader {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #2563EB;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .splash-message {
      color: rgba(255, 255, 255, 0.4);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      margin-top: 20px;
      letter-spacing: 0.3px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Patrón de fondo sutil */
    .splash-pattern {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      opacity: 0.03;
    }

    .splash-pattern div {
      position: absolute;
      border-radius: 50%;
      background: #2563EB;
    }

    .splash-pattern .dot1 { width: 300px; height: 300px; top: -80px; right: -60px; }
    .splash-pattern .dot2 { width: 200px; height: 200px; bottom: -40px; left: -40px; }
    .splash-pattern .dot3 { width: 120px; height: 120px; top: 40%; left: 10%; }
  </style>
</head>
<body>
  <!-- ==========================================
       SPLASH SCREEN - Visible inmediatamente
       ========================================== -->
  <div id="splash-screen">
    <div class="splash-pattern">
      <div class="dot1"></div>
      <div class="dot2"></div>
      <div class="dot3"></div>
    </div>
    <div class="splash-logo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="#2563EB" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M2 17L12 22L22 17" stroke="#2563EB" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M2 12L12 17L22 12" stroke="#2563EB" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="splash-title">FULLTECH</div>
    <div class="splash-subtitle">Tienda oficial</div>
    <div class="splash-loader"></div>
    <div class="splash-message">Tecnología, seguridad y automatización</div>
  </div>

  <!-- ==========================================
       BOOTSTRAP CON VERSIONADO Y CACHE CONTROL
       ========================================== -->
  <script>
    (function() {
      'use strict';
      var BUILD_VERSION = '__FULLTECH_BUILD_VERSION__';
      var VERSION_KEY = 'fulltech_app_version';
      
      // ==========================================
      // 1. EXPONER FUNCIÓN GLOBAL PARA OCULTAR SPLASH
      //    Flutter la llamará cuando esté listo
      // ==========================================
      window.fulltechHideSplash = function() {
        var splash = document.getElementById('splash-screen');
        if (splash) {
          splash.classList.add('hidden');
        }
      };

      // ==========================================
      // 2. EXPONER FUNCIÓN GLOBAL PARA RECARGAR
      // ==========================================
      window.fulltechReloadPage = function() {
        window.location.reload();
      };

      // ==========================================
      // 3. DETECCIÓN AUTOMÁTICA DE FLUTTER
      //    Observa el DOM hasta que aparezca el canvas de Flutter
      //    MÁXIMO 500ms para ocultar splash rápido
      // ==========================================
      function startFlutterDetection() {
        var checkCount = 0;
        var maxChecks = 5; // ~500ms máximo
        
        var checkInterval = setInterval(function() {
          checkCount++;
          
          // Detectar el canvas de Flutter (flt-glass-pane o canvas)
          var fltCanvas = document.querySelector('flt-glass-pane') || 
                          document.querySelector('canvas');
          
          // También detectar si el splash ya fue ocultado por Flutter
          var splash = document.getElementById('splash-screen');
          if (!splash) {
            clearInterval(checkInterval);
            return;
          }
          
          if (fltCanvas || checkCount >= maxChecks) {
            clearInterval(checkInterval);
            // Ocultar splash inmediatamente (sin delay)
            window.fulltechHideSplash();
          }
        }, 100);
      }

      // ==========================================
      // 4. LOG DE RENDIMIENTO INICIAL
      // ==========================================
      var perfStart = Date.now();
      console.log('[PERF] index.html loaded - ' + perfStart);
      
      // ==========================================
      // 5. NAVEGACIÓN POR HASH - SIN REDIRECT BLOQUEANTE
      //    Si la URL es raíz, establecer hash sin recargar
      //    para que Flutter pueda manejarlo internamente
      // ==========================================
      var path = window.location.pathname || "/";
      var hash = window.location.hash || "";
      var isRootPath = path === "/" || path === "";
      var isEmptyHash = hash === "" || hash === "#" || hash === "#/";
      
      if (isRootPath && isEmptyHash) {
        // NO hacer window.location.replace - eso DETIENE la carga de Flutter
        // En su lugar, establecer el hash sin recargar la página
        console.log('[FULLTECH] Ruta raíz - estableciendo hash para tienda');
        window.location.hash = '#/tienda/fulltech';
        // NO return - continuar con la carga de Flutter
      }
      
      // ==========================================
      // 6. LIMPIEZA DE CACHE (solo si hay cambio de versión)
      // ==========================================

      function clearRuntimeCaches() {
        var tasks = [];

        if ('serviceWorker' in navigator) {
          tasks.push(
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              return Promise.all(
                registrations.map(function(registration) {
                  return registration.unregister();
                })
              );
            })
          );
        }

        if (window.caches) {
          tasks.push(
            caches.keys().then(function(cacheNames) {
              return Promise.all(
                cacheNames.map(function(cacheName) {
                  return caches.delete(cacheName);
                })
              );
            })
          );
        }

        return Promise.all(tasks).catch(function(error) {
          console.warn('[FULLTECH] Error limpiando caches:', error);
        });
      }

      // ==========================================
      // 6. CARGA DE FLUTTER
      // ==========================================
      function loadFlutter(version) {
        var script = document.createElement('script');
        script.src = 'flutter_bootstrap.js?v=' + encodeURIComponent(version || Date.now().toString());
        script.async = false;
        script.onload = function() {
          // Iniciar detección del canvas de Flutter
          startFlutterDetection();
        };
        document.body.appendChild(script);
      }

      function fetchVersionWithTimeout(timeoutMs) {
        return new Promise(function(resolve, reject) {
          var settled = false;
          var timer = setTimeout(function() {
            if (settled) return;
            settled = true;
            reject(new Error('version.json timeout'));
          }, timeoutMs);

          fetch('version.json?ts=' + Date.now(), {
            cache: 'no-store'
          })
            .then(function(response) {
              if (!response.ok) {
                throw new Error('No se pudo cargar version.json');
              }
              return response.json();
            })
            .then(function(payload) {
              if (settled) return;
              settled = true;
              clearTimeout(timer);
              resolve(payload);
            })
            .catch(function(error) {
              if (settled) return;
              settled = true;
              clearTimeout(timer);
              reject(error);
            });
        });
      }

      // ==========================================
      // 7. VERIFICAR VERSIÓN Y CARGAR
      // ==========================================
      if (BUILD_VERSION !== '__FULLTECH_BUILD_VERSION__') {
        localStorage.setItem(VERSION_KEY, BUILD_VERSION);
        loadFlutter(BUILD_VERSION);
        return;
      }

      fetchVersionWithTimeout(150)

        .then(function(payload) {
          var currentVersion =
            BUILD_VERSION !== '__FULLTECH_BUILD_VERSION__'
              ? BUILD_VERSION
              : (payload && payload.version) || Date.now().toString();
          var lastVersion = localStorage.getItem(VERSION_KEY);

          if (lastVersion && lastVersion !== currentVersion) {
            console.log('[FULLTECH] Nueva versión detectada:', currentVersion, '(anterior:', lastVersion + ')');
            return clearRuntimeCaches().then(function() {
              localStorage.setItem(VERSION_KEY, currentVersion);
              loadFlutter(currentVersion);
            });
          }

          localStorage.setItem(VERSION_KEY, currentVersion);
          loadFlutter(currentVersion);
        })
        .catch(function(error) {
          console.warn('[FULLTECH] version.json lento o no disponible, cargando bootstrap directo.', error);
          loadFlutter(Date.now().toString());
        });

      // ==========================================
      // 8. TIMEOUT DE SEGURIDAD - MÁXIMO 2 SEGUNDOS
      //    Si Flutter no ha ocultado el splash en 2s,
      //    lo ocultamos igual para que se vea el fondo
      // ==========================================
      setTimeout(function() {
        var splash = document.getElementById('splash-screen');
        if (splash && !splash.classList.contains('hidden')) {
          window.fulltechHideSplash();
          console.log('[PERF] Splash ocultado por timeout de seguridad (2s)');
        }
      }, 2000);
    })();
  </script>
</body>
</html>
