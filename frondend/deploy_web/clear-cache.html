<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Limpiar Cache - FULLTECH SRL</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0F172A;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #1E293B;
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      border: 1px solid #334155;
    }
    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .logo span { color: #3B82F6; }
    .subtitle {
      color: #94A3B8;
      font-size: 14px;
      margin-bottom: 28px;
    }
    .status {
      background: #0F172A;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
      text-align: left;
      font-size: 13px;
      line-height: 1.6;
    }
    .status .label { color: #64748B; }
    .status .value { color: #E2E8F0; font-weight: 600; }
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 12px;
    }
    .btn-primary {
      background: #3B82F6;
      color: #fff;
    }
    .btn-primary:hover { background: #2563EB; }
    .btn-secondary {
      background: #334155;
      color: #E2E8F0;
    }
    .btn-secondary:hover { background: #475569; }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .success {
      color: #22C55E;
      font-weight: 600;
      margin-top: 12px;
    }
    .error {
      color: #EF4444;
      font-weight: 600;
      margin-top: 12px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">FULL<span>TECH</span></div>
    <div class="subtitle">Herramienta de limpieza de caché</div>

    <div class="status" id="status">
      <div><span class="label">Service Worker:</span> <span class="value" id="swStatus">Verificando...</span></div>
      <div><span class="label">Caches activos:</span> <span class="value" id="cacheCount">-</span></div>
      <div><span class="label">Versión actual:</span> <span class="value" id="currentVersion">-</span></div>
    </div>

    <button class="btn btn-primary" id="btnClear" onclick="clearAllCaches()">
      🗑️ Limpiar todo el caché
    </button>
    <button class="btn btn-secondary" id="btnReload" onclick="reloadStore()" disabled>
      🔄 Recargar tienda
    </button>

    <div id="message"></div>
  </div>

  <script>
    async function checkStatus() {
      try {
        // Verificar service worker
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          document.getElementById('swStatus').textContent = 
            registrations.length > 0 ? '✅ Registrado' : '❌ No registrado';
        } else {
          document.getElementById('swStatus').textContent = '⚠️ No soportado';
        }

        // Verificar caches
        if ('caches' in window) {
          const keys = await caches.keys();
          document.getElementById('cacheCount').textContent = keys.length > 0 
            ? keys.join(', ') 
            : 'Ninguno';
        }

        // Verificar versión
        try {
          const res = await fetch('/version.json?_=' + Date.now());
          const data = await res.json();
          document.getElementById('currentVersion').textContent = data.version || 'Desconocida';
        } catch(e) {
          document.getElementById('currentVersion').textContent = 'No disponible';
        }
      } catch(e) {
        console.error('Error checking status:', e);
      }
    }

    async function clearAllCaches() {
      const btn = document.getElementById('btnClear');
      const msg = document.getElementById('message');
      btn.disabled = true;
      msg.className = '';
      msg.textContent = 'Limpiando...';

      try {
        // Limpiar caches
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(key => caches.delete(key)));
        }

        // Desregistrar service workers
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(reg => reg.unregister()));
        }

        msg.className = 'success';
        msg.textContent = '✅ Caché limpiado correctamente';
        document.getElementById('btnReload').disabled = false;
        
        // Actualizar estado
        await checkStatus();
      } catch(e) {
        msg.className = 'error';
        msg.textContent = '❌ Error: ' + e.message;
      } finally {
        btn.disabled = false;
      }
    }

    function reloadStore() {
      window.location.href = '/';
    }

    // Verificar estado al cargar
    checkStatus();
  </script>
</body>
</html>
